name: TennisTrack Auto
on:
  push:
    paths: ['.github/workflows/update-tournois.yml']
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'EOF'
          import glob, os, zipfile
          for z in glob.glob('*.zip'):
              with zipfile.ZipFile(z) as f:
                  for m in f.namelist():
                      if not m.startswith('.github/') and '__pycache__' not in m and not m.endswith('.pyc'):
                          f.extract(m, '.')
              os.remove(z)
          if os.path.exists('IMG_5058.jpeg'):
              os.remove('IMG_5058.jpeg')
          EOF
      - run: pip install requests beautifulsoup4
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/scrape_tournois.py
      - run: |
          git config user.name "TennisTrack Bot"
          git config user.email "bot@tennistrack.local"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto update" && git push)
